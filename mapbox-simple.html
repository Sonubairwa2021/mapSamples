<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Mapbox Path Integration (Point A to Point B)</title>

  <!-- 1. Mapbox GL JS Library & Stylesheet -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    /* Map Container */
    #map {
      width: 100%;
      height: 500px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    .info-box {
      margin-top: 15px;
      padding: 12px 16px;
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      font-size: 14px;
      color: #334155;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Mapbox: Simple Point A to Point B Route</h2>
    <div id="map"></div>
    <div class="info-box" id="route-info">
      <strong>Route Status:</strong> <span id="status-text">Loading route...</span>
    </div>
  </div>

  <script>
    // ==========================================
    // STEP 1: Set your Mapbox Access Token
    // ==========================================
    mapboxgl.accessToken = ''; // Replace with your own token

    // ==========================================
    // STEP 2: Define Point A and Point B [Longitude, Latitude]
    // ==========================================
    const pointA = [-122.4194, 37.7749]; // San Francisco [lng, lat]
    const pointB = [-121.8863, 37.3382]; // San Jose [lng, lat]

    // ==========================================
    // STEP 3: Initialize Map
    // ==========================================
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/streets-v12', // or 'mapbox://styles/mapbox/dark-v11'
      center: [(pointA[0] + pointB[0]) / 2, (pointA[1] + pointB[1]) / 2],
      zoom: 9
    });

    // Add Zoom & Rotation controls
    map.addControl(new mapboxgl.NavigationControl(), 'top-right');

    // ==========================================
    // STEP 4: Add Markers for Point A and Point B
    // ==========================================
    // Point A (Green)
    new mapboxgl.Marker({ color: '#10b981' })
      .setLngLat(pointA)
      .setPopup(new mapboxgl.Popup().setHTML('<strong>Point A (Start)</strong>'))
      .addTo(map);

    // Point B (Red)
    new mapboxgl.Marker({ color: '#ef4444' })
      .setLngLat(pointB)
      .setPopup(new mapboxgl.Popup().setHTML('<strong>Point B (Destination)</strong>'))
      .addTo(map);

    // ==========================================
    // STEP 5: Draw Route Path
    // ==========================================
    map.on('load', function() {
      // Fetch road driving path from free OSRM API (or use direct line)
      const routeUrl = `https://router.project-osrm.org/route/v1/driving/${pointA[0]},${pointA[1]};${pointB[0]},${pointB[1]}?overview=full&geometries=geojson`;

      fetch(routeUrl)
        .then(response => response.json())
        .then(data => {
          let coordinates = [pointA, pointB]; // fallback straight line

          if (data.routes && data.routes.length > 0) {
            coordinates = data.routes[0].geometry.coordinates; // real road coordinates
            const distanceKm = (data.routes[0].distance / 1000).toFixed(1);
            const durationMin = Math.round(data.routes[0].duration / 60);
            document.getElementById('status-text').innerText = `Distance: ${distanceKm} km | Duration: ${durationMin} min`;
          }

          // Add GeoJSON Source for the path
          map.addSource('route-path', {
            type: 'geojson',
            data: {
              type: 'Feature',
              properties: {},
              geometry: {
                type: 'LineString',
                coordinates: coordinates
              }
            }
          });

          // Add Line Layer to display the path on the map
          map.addLayer({
            id: 'route-line',
            type: 'line',
            source: 'route-path',
            layout: {
              'line-join': 'round',
              'line-cap': 'round'
            },
            paint: {
              'line-color': '#2563eb', // Path color (Blue)
              'line-width': 5,         // Path line thickness
              'line-opacity': 0.85
            }
          });

          // Fit map camera to show both points and the route
          const bounds = new mapboxgl.LngLatBounds();
          coordinates.forEach(coord => bounds.extend(coord));
          map.fitBounds(bounds, { padding: 50 });
        })
        .catch(err => {
          console.error('Error fetching route:', err);
          // Fallback direct line between Point A and B
          map.addSource('route-path', {
            type: 'geojson',
            data: {
              type: 'Feature',
              geometry: { type: 'LineString', coordinates: [pointA, pointB] }
            }
          });
          map.addLayer({
            id: 'route-line',
            type: 'line',
            source: 'route-path',
            paint: { 'line-color': '#2563eb', 'line-width': 4 }
          });
          document.getElementById('status-text').innerText = 'Connected via direct line';
        });
    });
  </script>

</body>
</html>
